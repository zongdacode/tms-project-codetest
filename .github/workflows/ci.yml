name: CI

# 批 0 的 CI 只跑 H2 + 架构测试。
# 真实 MySQL / Redis 的任务待环境解锁后补：本机无 WSL2、Docker 引擎起不来（docs/13-gate0 §5），
# 在 CI 镜像里配一套真实库之前，先把"只有生成代码能跑"的部分守住。
#
# ⚠ 2026-10-05：本文件曾被 GitHub 网页端的 Java 模板覆盖，丢掉了「架构红线专项」这一步。
#   模板版的 `mvn -B clean verify` 功能上没问题，但把红线测试埋回了几百条测试输出里——
#   它守的是 [10-risk-and-redlines] 的硬红线，埋在输出里就等于没人看。
#   现恢复分步执行；模板版唯一更好的地方（失败也上传报告）予以保留。
on:
  push:
    branches: [main]
    paths:
      - 'tms-project/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'tms-project/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: tms-project

jobs:
  build:
    name: 编译 / 测试 / 架构红线 / 打包
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 分成四步而不是一条 mvn verify，是为了让失败位置一眼可见：
      # 架构红线红了和某个业务单测红了，处理方式和紧急程度完全不同。
      - name: 编译
        run: mvn -B -DskipTests compile

      - name: 单元测试与集成测试（H2）
        run: mvn -B test

      # 架构测试在上面那步里已经跑过一次。这里单独再跑一次，是为了让它在
      # GitHub 的步骤列表里独立可见——它守的是 [10-risk-and-redlines] 的硬红线，
      # 埋在几百条测试输出里就等于没人看。
      - name: 架构红线专项
        run: >
          mvn -B test
          -Dtest='ArchitectureRulesTest,ArchRulesCounterexampleTest,R2PlanTableFieldWhitelistTest'
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: 打包
        run: mvn -B -DskipTests package

      - name: 上传可运行包
        uses: actions/upload-artifact@v4
        with:
          name: tms-admin-jar
          path: tms-project/tms-admin/target/tms-admin-*.jar
          if-no-files-found: error

      # 失败时也要能把 surefire 报告取下来排查（取自网页端模板版本，保留）。
      # 注意 upload-artifact 的 path 相对仓库根目录，不受上面 working-directory 影响。
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: 'tms-project/**/target/surefire-reports/'
