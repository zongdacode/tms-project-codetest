name: CI

# 批 0 的 CI 只跑 H2 + 架构测试。
# 真实 MySQL / Redis 的任务待环境解锁后补：本机无 WSL2、Docker 引擎起不来（docs/13-gate0 §5），
# 在 CI 镜像里配一套真实库之前，先把"只有生成代码能跑"的部分守住。
on:
  push:
    branches: [main, master]
    paths:
      - 'tms-project/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'tms-project/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: tms-project

jobs:
  build:
    name: 编译 / 测试 / 架构红线 / 打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 分成四步而不是一条 mvn verify，是为了让失败位置一眼可见：
      # 架构红线红了和某个业务单测红了，处理方式和紧急程度完全不同。
      - name: 编译
        run: mvn -B -DskipTests compile

      - name: 单元测试与集成测试（H2）
        run: mvn -B test

      # 架构测试在上面那步里已经跑过一次。这里单独再跑一次，是为了让它在
      # GitHub 的步骤列表里独立可见——它守的是 [10-risk-and-redlines] 的硬红线，
      # 埋在几百条测试输出里就等于没人看。
      - name: 架构红线专项
        run: >
          mvn -B test
          -Dtest='ArchitectureRulesTest,ArchRulesCounterexampleTest,R2PlanTableFieldWhitelistTest'
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: 打包
        run: mvn -B -DskipTests package

      - name: 上传可运行包
        uses: actions/upload-artifact@v4
        with:
          name: tms-admin-jar
          path: tms-project/tms-admin/target/tms-admin-*.jar
          if-no-files-found: error
