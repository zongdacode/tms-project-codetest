# H2 内存库 profile：测试与 CI 用。
#
# 明确它不是 MySQL 的等价物：分页写法、JSON 列类型、锁行为都有差异。
# 用它验证的是"装配是否正确、SQL 能否跑通"，不是"上线能否跑通"。
# MySQL 上的验证见 [13-gate0] §5。
#
# ⚠ 这个 profile 跑不了 `mvn spring-boot:run`：h2 依赖是 test scope，
# 打包后的应用里没有 H2 驱动。它只服务于测试上下文（@ActiveProfiles("h2")）。
# 本地起应用连 MySQL；若确实需要"无外部依赖地跑起来"，得先把 h2 提到 runtime scope——
# 那会把一个开发库驱动打进生产包，不建议。
spring:
  datasource:
    url: jdbc:h2:mem:tms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never

# 批 0 不使用 Redis（RedisCacheHelper / RedisDistributedLock 尚未验证，见类注释），
# 但 spring-boot-starter-data-redis 已在依赖里，健康检查会去连它、连不上就整体 DOWN。
# 本 profile 的语义就是"不依赖任何外部服务"，所以在这里关掉这个指标。
#
# ⚠ 只关本 profile，不动 application.yml：生产那份保持打开。
# 批 1 真正开始用 Redis 之后，这一行必须删掉——否则 Redis 宕机时健康检查仍然报 UP，
# 变成一个"监控看起来正常、功能已经坏了"的静默故障。
management:
  health:
    redis:
      enabled: false
