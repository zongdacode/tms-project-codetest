name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: H2 内存库快速测试（单元测试 + 架构测试 + 基础集成测试）
  # 速度快，每次 push 都跑，用于快速反馈代码是否能编译、基础逻辑是否正确。
  test-h2:
    name: Test (H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test with H2
        run: mvn -B test -Dspring.profiles.active=h2
        env:
          # 确保测试走 h2 profile
          SPRING_PROFILES_ACTIVE: h2

  # Job 2: 真实 MySQL 集成测试
  # 用 service 容器起 MySQL 8.0，跑全量集成测试，
  # 验证 Flyway 迁移、MyBatis SQL、事务、乐观锁等在真实 MySQL 上的行为。
  test-mysql:
    name: Test (MySQL 8.0)
    runs-on: ubuntu-latest
    needs: test-h2      # H2 过了才跑 MySQL，省资源
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123456
          MYSQL_DATABASE: tms
          MYSQL_USER: tms
          MYSQL_PASSWORD: tms123456
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -u tms -ptms123456"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test with MySQL
        run: mvn -B test
        env:
          # 使用默认 profile（连 MySQL），端口映射到 localhost:3306
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/tms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
          SPRING_DATASOURCE_USERNAME: tms
          SPRING_DATASOURCE_PASSWORD: tms123456

  # Job 3: 打包验证（只在 main 分支跑）
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: test-mysql
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package (skip tests, already verified)
        run: mvn -B package -DskipTests

      - name: Upload admin jar
        uses: actions/upload-artifact@v4
        with:
          name: tms-admin
          path: tms-admin/target/*.jar
